name: CI/CD - build, scan, deploy to AKS

# Runs on every push to main (full deploy) and every PR (quality gates only,
# no deploy — you never want a PR to change live infra).
on:
  push:
    branches: [main]
    # Documentation-only changes shouldn't rebuild infrastructure or deploy.
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".gitattributes"

# OIDC: id-token write lets the runner request a GitHub identity token that
# Azure trusts (the federated credential we set up). contents read = checkout.
permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # QUALITY GATES — must pass before anything is built or deployed.
  # Credential-free on purpose: safe to run on PRs from anywhere.
  # ---------------------------------------------------------------------------
  quality:
    name: Tests & static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests (pytest)
        run: pytest -q

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform validate
        # -backend=false: validate syntax/types without touching remote state
        # or needing Azure creds — keeps this job credential-free.
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --chdir=terraform

  # ---------------------------------------------------------------------------
  # DEPLOY — only on push to main, only if quality passed.
  # Provisions infra (Terraform), builds + scans + pushes the image, deploys.
  # ---------------------------------------------------------------------------
  deploy:
    name: Provision, scan & deploy
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      # Terraform azurerm provider + backend auth via GitHub OIDC (no secrets).
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      # Logs the az CLI in via OIDC (used later for ACR + AKS).
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform apply (provision RG, ACR, AKS)
        run: |
          terraform -chdir=terraform init -input=false
          terraform -chdir=terraform apply -auto-approve -input=false

      - name: Read Terraform outputs
        id: tf
        run: |
          cd terraform
          echo "acr_name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"
          echo "aks=$(terraform output -raw aks_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "rg=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"

      # Immutable tag = git commit SHA. Every deploy is traceable to a commit.
      - name: Build image
        run: docker build -t "${{ steps.tf.outputs.acr_login_server }}/fastapi-aks-api:${{ github.sha }}" .

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.tf.outputs.acr_login_server }}/fastapi-aks-api:${{ github.sha }}"
          format: table
          exit-code: "1" # fail the build on findings
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push image to ACR
        run: |
          az acr login --name "${{ steps.tf.outputs.acr_name }}"
          docker push "${{ steps.tf.outputs.acr_login_server }}/fastapi-aks-api:${{ github.sha }}"

      - name: Deploy to AKS
        run: |
          az aks get-credentials --resource-group "${{ steps.tf.outputs.rg }}" --name "${{ steps.tf.outputs.aks }}" --overwrite-existing
          IMAGE="${{ steps.tf.outputs.acr_login_server }}/fastapi-aks-api:${{ github.sha }}"
          sed "s|__IMAGE__|${IMAGE}|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/fastapi-aks-api --timeout=180s

      - name: Show public endpoint
        run: |
          IP=$(kubectl get svc fastapi-aks-api -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "### Deployed 🚀  http://$IP/hello?name=Ziad" >> "$GITHUB_STEP_SUMMARY"
